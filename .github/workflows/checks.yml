name: Tests and Bandit

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      SUBNET_GUI_REQUIRE_DISPLAY: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests on Linux virtual display
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m unittest discover -s tests -v
          xvfb-run -a python -O -m unittest discover -s tests -v
      - name: Tests on Windows
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O -m unittest discover -s tests -v
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: 'python -m pip install --only-binary=:all: -r requirements-security.txt'
      - run: python -m bandit subnet_calc.py subnet_gui.py subnet_gui.pyw
